# ------------------------------------------------
# Override DEV uniquement
# ------------------------------------------------
services:

  php:
    volumes:
      - .:/var/www/symfony
      - php_cache:/var/www/symfony/var/cache
      - php_log:/var/www/symfony/var/log
      - symfony_vendor:/var/www/symfony/vendor
      - assets_vendor:/var/www/symfony/assets/vendor
    ports:
      - "8081:80" # 8080 est pris par Cabin Access
    environment:
      APP_ENV: dev # en dur : `.env` contient APP_ENV=prod, que Compose lirait via ${APP_ENV}

  database:
    environment:
      # Dev : pas de mot de passe (base joignable seulement depuis Docker et depuis cette machine).
      # Pris en compte à la création du volume : après changement, `docker compose down -v`.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5433:5432" # client SQL (PhpStorm…) : localhost:5433, base app, utilisateur app ; 127.0.0.1 = jamais exposé au réseau

volumes:
  php_cache:
  php_log:
  symfony_vendor:
  assets_vendor:
