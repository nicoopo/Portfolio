# Configuration de l'analyse SonarQube (SonarQube local, lancé par ~/outils/sonarqube/scan-portfolio.sh,
# qui fournit la couverture PHPUnit produite par la CI et la révision analysée).
sonar.projectKey=portfolio
sonar.sources=src,templates,assets,config
sonar.tests=tests

# assets/vendor : dépendances JS (importmap).
# csrf_protection_controller.js : fichier de la recette Symfony (symfony.lock), réécrit à chaque mise à
# jour de la recette, donc pas corrigé à la main.
sonar.exclusions=node_modules/**,assets/vendor/**,assets/controllers/csrf_protection_controller.js

# Couverture PHPUnit (artefact « coverage » de la CI, chemins réécrits par le script de scan)
sonar.php.coverage.reportPaths=var/coverage/clover.xml
# Couverture mesurée sur le PHP seulement : pas de tests JS dans le Portfolio (même choix que Cabin Access).
# Le JS reste analysé (bugs, code smells) ; il ne compte simplement pas dans le pourcentage de couverture.
sonar.coverage.exclusions=assets/**
