name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

env:
  APP_ENV: test

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # un job bloqué (téléchargement qui ne répond plus) s'arrête au lieu de tourner 6 h
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: ctype, iconv, mbstring, xml, zip, intl, gd
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Audit des dépendances PHP (failles connues)
        run: composer audit

      - name: Audit des paquets JS de l'importmap (failles connues)
        run: php bin/console importmap:audit
        env:
          GITHUB_TOKEN: ${{ github.token }} # requêtes authentifiées : pas de limite partagée (voir framework.yaml)

      - name: Lint YAML config
        run: php bin/console lint:yaml config --parse-tags

      - name: Lint Twig templates
        run: php bin/console lint:twig templates

      - name: Lint container
        run: php bin/console lint:container

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # un job bloqué (téléchargement qui ne répond plus) s'arrête au lieu de tourner 6 h
    services:
      database:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -d app -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://app:app@127.0.0.1:5432/app?serverVersion=16&charset=utf8
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: ctype, iconv, mbstring, xml, zip, intl, pdo_pgsql, gd
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install importmap
        run: php bin/console importmap:install

      - name: Database (app_test) + migrations
        run: |
          php bin/console doctrine:database:create --if-not-exists
          php bin/console doctrine:migrations:migrate --no-interaction
          php bin/console doctrine:schema:validate

      - name: Run tests
        run: vendor/bin/phpunit

  # Audit axe-core de chaque page publique (FR + EN) sur le site démarré en mode prod : échoue en cas de violation
  accessibilite:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # un job bloqué (téléchargement qui ne répond plus) s'arrête au lieu de tourner 6 h
    services:
      database:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -d app -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ci-accessibilite
      DATABASE_URL: postgresql://app:app@127.0.0.1:5432/app?serverVersion=16&charset=utf8
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: ctype, iconv, mbstring, xml, zip, intl, pdo_pgsql, gd
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Assets et base (les migrations remplissent le contenu du site)
        run: |
          php bin/console importmap:install
          php bin/console asset-map:compile
          php bin/console doctrine:migrations:migrate --no-interaction

      - name: Démarrer le site
        run: php -S 127.0.0.1:8000 -t public > /tmp/serveur.log 2>&1 &

      - name: Installer Playwright et axe-core
        run: |
          npm install --no-save --no-audit --no-fund playwright @axe-core/playwright
          npx playwright install --with-deps chromium

      - name: Audit d'accessibilité
        run: node tests/accessibilite.mjs

      # Palette, terminal, comparateur, contact, langue ; échoue aussi sur une erreur JavaScript
      - name: Parcours dans le navigateur
        run: node tests/parcours.mjs

      - name: Logs du serveur (en cas d'échec)
        if: failure()
        run: cat /tmp/serveur.log
