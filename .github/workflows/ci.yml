name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  APP_ENV: test

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # un job bloqué (téléchargement qui ne répond plus) s'arrête au lieu de tourner 6 h
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: ctype, iconv, mbstring, xml, zip, intl, gd, exif
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Audit des dépendances PHP (failles connues)
        run: composer audit

      - name: Audit des paquets JS de l'importmap (failles connues)
        run: php bin/console importmap:audit
        env:
          GITHUB_TOKEN: ${{ github.token }} # requêtes authentifiées : pas de limite partagée (voir framework.yaml)

      - name: Lint YAML config
        run: php bin/console lint:yaml config --parse-tags

      - name: Lint Twig templates
        run: php bin/console lint:twig templates

      - name: Lint container
        run: php bin/console lint:container

  tests:
    # Pas ubuntu-latest : passé à ubuntu-26.04 le 2026-10-21, où le même PHP 8.5.12 refuse
    # les fuseaux (SmokeTest::testLesArriveesSontPlaceesSurLeGlobe en 400 ; données de fuseaux
    # lues dans le système, cause exacte non isolée). La prod (image Docker Debian) n'est pas
    # concernée. À revoir avant la fin de vie de 24.04 (2029).
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # un job bloqué (téléchargement qui ne répond plus) s'arrête au lieu de tourner 6 h
    services:
      database:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -d app -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://app:app@127.0.0.1:5432/app?serverVersion=16&charset=utf8
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: ctype, iconv, mbstring, xml, zip, intl, pdo_pgsql, gd, exif
          coverage: pcov # couverture pour SonarQube (~/outils/sonarqube/scan-portfolio.sh)

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install importmap
        run: php bin/console importmap:install

      - name: Database (app_test) + migrations
        run: |
          php bin/console doctrine:database:create --if-not-exists
          php bin/console doctrine:migrations:migrate --no-interaction
          php bin/console doctrine:schema:validate

      - name: Run tests
        run: vendor/bin/phpunit --coverage-clover var/coverage/clover.xml

      # Récupéré par ~/outils/sonarqube/scan-portfolio.sh (SonarQube local, injoignable depuis GitHub Actions)
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: var/coverage/clover.xml
          retention-days: 30

  # Audit axe-core de chaque page publique (FR + EN) sur le site démarré en mode prod : échoue en cas de violation
  accessibilite:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # un job bloqué (téléchargement qui ne répond plus) s'arrête au lieu de tourner 6 h
    services:
      database:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -d app -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ci-accessibilite
      DATABASE_URL: postgresql://app:app@127.0.0.1:5432/app?serverVersion=16&charset=utf8
      PLAYWRIGHT: 1.64.1 # version de l'image Docker et du paquet npm (doivent être identiques)
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: ctype, iconv, mbstring, xml, zip, intl, pdo_pgsql, gd, exif
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Assets et base (les migrations remplissent le contenu du site)
        run: |
          php bin/console importmap:install
          php bin/console asset-map:compile
          php bin/console doctrine:migrations:migrate --no-interaction

      # variables_order=EGPCS : sans « E », le serveur intégré ne passe pas l'environnement du job (DATABASE_URL)
      # à l'application, qui retombe sur la base du poste de dev (.env) : toute page lisant la base répondait 500
      - name: Démarrer le site
        run: php -d variables_order=EGPCS -S 127.0.0.1:8000 -t public > /tmp/serveur.log 2>&1 &

      # Image officielle de Playwright : Chromium et ses dépendances système déjà dedans. Avant, `playwright install
      # --with-deps` passait par apt, et un miroir Ubuntu lent faisait durer l'installation 10 min au lieu de 20 s.
      # Le paquet npm doit avoir la même version que l'image. Réseau de la machine : le site (8000) et la base y sont.
      - name: Installer Playwright et axe-core
        run: |
          docker pull -q mcr.microsoft.com/playwright:v${PLAYWRIGHT}-noble
          docker run --rm -v "$PWD":/w -w /w mcr.microsoft.com/playwright:v${PLAYWRIGHT}-noble \
            npm install --no-save --no-audit --no-fund playwright@${PLAYWRIGHT} @axe-core/playwright

      - name: Audit d'accessibilité
        run: docker run --rm --network host -v "$PWD":/w -w /w mcr.microsoft.com/playwright:v${PLAYWRIGHT}-noble node tests/accessibilite.mjs

      # Palette, terminal, comparateur, contact, langue ; échoue aussi sur une erreur JavaScript
      - name: Parcours dans le navigateur
        run: docker run --rm --network host -v "$PWD":/w -w /w mcr.microsoft.com/playwright:v${PLAYWRIGHT}-noble node tests/parcours.mjs

      - name: Logs du serveur (en cas d'échec)
        if: failure()
        run: cat /tmp/serveur.log
