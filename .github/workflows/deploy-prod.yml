name: Deploy prod

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: [self-hosted, portfolio]
    # Pas de actions/checkout : on travaille directement dans le dossier
    # de projet existant sur le serveur, là où vit .env.local (secrets
    # réels, ignoré par git, jamais recréé par un checkout classique).
    env:
      PROJECT_DIR: /home/nicolas/PhpstormProjects/Portfolio
    steps:
      - name: Mettre à jour le code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$PROJECT_DIR"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" fetch origin master
          git reset --hard origin/master

      - name: Déployer en prod
        run: |
          cd "$PROJECT_DIR"
          bash scripts/deploy-prod.sh
