# Fichiers compilés par AssetMapper (/assets) : leur nom contient une empreinte du contenu
# (three.index-jSK_TvE.js) qui change à chaque modification → on peut les garder un an en cache.
<LocationMatch "^/assets/">
    Header set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>

# Le SVG est du texte : compressé comme le HTML, le CSS et le JS (deflate.conf de Debian l'oublie)
<IfModule mod_filter.c>
    AddOutputFilterByType DEFLATE image/svg+xml
</IfModule>
