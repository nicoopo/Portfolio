controllers:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute
    # Français sans préfixe (les liens existants ne changent pas), anglais sous /en.
    # path('app_home') donne la version de la langue courante ; _locale: 'en' force l'autre.
    prefix:
        fr: ''
        en: '/en'

# Hors du préfixe de langue ci-dessus : un seul sitemap, qui liste les deux langues
app_sitemap:
    path: /sitemap.xml
    controller: App\Controller\SitemapController
