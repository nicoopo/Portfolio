# yaml-language-server: $schema=../vendor/symfony/routing/Loader/schema/routing.schema.json

# Point d'entrée des routes : les méthodes portant #[Route] sont importées ci-dessous.
# Liste complète : bin/console debug:router

controllers:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute
    # Français sans préfixe (les liens existants ne changent pas), les autres langues sous /en, /es…
    # (liste : framework.enabled_locales). path('app_home') donne la version de la langue courante ;
    # _locale: 'es' force une autre langue.
    prefix:
        fr: ''
        en: '/en'
        es: '/es'
        de: '/de'
        it: '/it'
        pt: '/pt'

# Hors du préfixe de langue ci-dessus : un seul sitemap, qui liste les deux langues
app_sitemap:
    path: /sitemap.xml
    controller: App\Controller\SitemapController

# Rapports de la Content-Security-Policy envoyés par les navigateurs (ContentSecurityPolicyListener)
app_csp_report:
    path: /csp-report
    controller: App\Controller\CspReportController
    methods: [POST]
