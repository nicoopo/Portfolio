# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
        http_client:
            scoped_clients:
                # importmap:audit (CI) interroge l'API GitHub : sans jeton, la limite de 60 requêtes/heure est
                # partagée entre toutes les machines de GitHub Actions et l'audit échoue au hasard (403).
                # Le jeton n'est ajouté qu'aux requêtes vers api.github.com (jamais vers jsDelivr).
                github_api.client:
                    scope: 'https://api\.github\.com/'
                    headers:
                        Authorization: 'Bearer %env(default::GITHUB_TOKEN)%'

when@prod:
    framework:
        # Caddy (sur la machine) reçoit le HTTPS et transmet au container : on lit dans ses en-têtes
        # l'IP du visiteur et le schéma https (liens générés, redirections, cookies « secure »).
        # Sans risque : le container n'écoute que sur 127.0.0.1 (compose.prod.yaml), seul Caddy lui parle.
        trusted_proxies: 'private_ranges'
        trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-host', 'x-forwarded-port']
