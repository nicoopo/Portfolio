twig:
    file_name_pattern: '*.twig'
    globals:
        langues_site: '%kernel.enabled_locales%' # menu de langue, hreflang, sitemap

when@test:
    twig:
        strict_variables: true

when@prod:
    twig:
        globals:
            sentry_dsn: '%env(SENTRY_DSN)%' # erreurs JS (assets/scripts/erreurs.js) ; vide = pas d'envoi
